name: Publish GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      - name: Build versioned dashboard site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/latest
          cp -R dist/. site/latest/
          touch site/.nojekyll

          while IFS= read -r tag; do
            work_dir="$(mktemp -d)"
            git archive "$tag" dist | tar -x -C "$work_dir"
            mkdir -p "site/$tag"
            cp -R "$work_dir/dist/." "site/$tag/"
          done < <(git tag --list 'v*' --sort=version:refname)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
