name: Release HA packages
# Выпуск по версии из GitVersion. Владелец поднимает next-version в GitVersion.yml, коммитит в main и
# запускает этот workflow; здесь версия вписывается во все файлы, сборка проверяется, результат коммитится в main с тегом,
# создаётся GitHub-релиз с архивами и обновляется каталог на GitHub Pages. Если тег этой версии уже
# есть, версия пересобирается: прежние релиз и тег удаляются и создаются заново из текущего main.
# Только вручную: Actions → «Release HA packages» → Run workflow. Автоматических запусков нет.
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.8.x'
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - id: check
        name: Resolve the release version
        run: echo "version=${{ steps.gitversion.outputs.majorMinorPatch }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exported source
        run: python3 -c "import json;assert json.load(open('source.json'))['dirty'] is False, 'Export committed source before publishing'"
      - run: python3 tools/stamp-version.py '${{ steps.check.outputs.version }}'
      - run: npm test
      - run: python3 tools/package.py --output packages
      # После успешной сборки: упавшая проверка не должна оставить версию без релиза.
      - name: Drop the previous release and tag of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ steps.check.outputs.version }}'
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            git push origin --delete "v$VERSION"
          fi
          git tag -d "v$VERSION" 2>/dev/null || true
      - name: Commit the stamped version and tag it
        run: |
          VERSION='${{ steps.check.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- package.json releases.json dist integration
          git commit -m "release: v$VERSION" || echo 'Files already carry this version'
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ steps.check.outputs.version }}'
          gh release create "v$VERSION" packages/*.zip packages/SHA256SUMS.txt \
            --title "Guardian Eye HA $VERSION" --notes-file docs/RELEASE.md --verify-tag
      - uses: actions/configure-pages@v5
      - run: python3 tools/build-site.py --output site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy compatible catalog and versioned resources
        id: deployment
        uses: actions/deploy-pages@v4
