name: Publish compatible HA packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release identity
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = json.loads(Path('source.json').read_text())
          assert source['dirty'] is False, 'Export committed source before publishing'
          release = json.loads(Path('dist/guardian-eye-dashboard-release.json').read_text())
          head = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tag = subprocess.check_output(['git','rev-parse','v'+release['version']+'^{commit}'],text=True).strip()
          assert head == tag, 'Release tag must point to this commit'
          PY
      - run: npm test
      - run: python3 tools/package.py --output packages
      - name: Publish matching release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "v$VERSION" --pattern SHA256SUMS.txt --dir existing-release
            cmp packages/SHA256SUMS.txt existing-release/SHA256SUMS.txt
          else
            gh release create "v$VERSION" packages/*.zip packages/SHA256SUMS.txt \
              --title "Guardian Eye HA $VERSION" --notes-file docs/RELEASE.md --verify-tag
          fi
      - uses: actions/configure-pages@v5
      - run: python3 tools/build-site.py --output site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compatible catalog and versioned resources
        id: deployment
        uses: actions/deploy-pages@v4
